<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Passwordless login for Express</title>
  <desc id="desc">A sign-in card with six digit boxes for an emailed code, next to the project name.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#d9dee6"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="#f2f4f7"/>
  <rect x="700" y="0" width="580" height="400" fill="url(#grid)" opacity="0.7"/>

  <!-- Left: name and summary -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(80 104)">
      <rect width="48" height="48" rx="12" fill="#edf2fc"/>
      <g transform="translate(12 12)" fill="none" stroke="#2457c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
      </g>
    </g>
    <text x="80" y="214" font-size="44" font-weight="700" fill="#1a2230" letter-spacing="-0.8">Passwordless login</text>
    <text x="80" y="266" font-size="44" font-weight="700" fill="#1a2230" letter-spacing="-0.8">for Express</text>
    <text x="80" y="314" font-size="20" fill="#5d6878">Email codes and magic links, sent with Mailtrap.</text>
  </g>

  <!-- Right: sign-in card -->
  <g filter="url(#shadow)">
    <rect x="770" y="60" width="420" height="280" rx="18" fill="#ffffff" stroke="#e1e5eb"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(806 92)">
      <rect width="40" height="40" rx="10" fill="#edf2fc"/>
      <g transform="translate(8 8)" fill="none" stroke="#2457c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m3.5 7 8.5 6 8.5-6"/>
      </g>
    </g>
    <text x="806" y="164" font-size="22" font-weight="700" fill="#1a2230" letter-spacing="-0.3">Check your email</text>

    <!-- six digit boxes: four typed, the fifth focused -->
    <g font-size="26" font-weight="600" fill="#1a2230" text-anchor="middle">
      <rect x="806" y="188" width="52" height="60" rx="9" fill="#fff" stroke="#c5ccd6"/>
      <text x="832" y="228">4</text>
      <rect x="866" y="188" width="52" height="60" rx="9" fill="#fff" stroke="#c5ccd6"/>
      <text x="892" y="228">8</text>
      <rect x="926" y="188" width="52" height="60" rx="9" fill="#fff" stroke="#c5ccd6"/>
      <text x="952" y="228">2</text>
      <rect x="986" y="188" width="52" height="60" rx="9" fill="#fff" stroke="#c5ccd6"/>
      <text x="1012" y="228">9</text>
      <rect x="1043" y="185" width="58" height="66" rx="11" fill="none" stroke="#2457c5" stroke-opacity="0.28" stroke-width="4"/>
      <rect x="1046" y="188" width="52" height="60" rx="9" fill="#fff" stroke="#2457c5"/>
      <rect x="1071" y="204" width="2" height="28" rx="1" fill="#2457c5"/>
      <rect x="1106" y="188" width="52" height="60" rx="9" fill="#fff" stroke="#c5ccd6"/>
    </g>

    <rect x="806" y="268" width="352" height="46" rx="9" fill="#2457c5"/>
    <text x="982" y="297" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Sign in</text>
  </g>
</svg>
